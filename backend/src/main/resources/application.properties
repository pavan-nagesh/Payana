server.port=8080
spring.application.name=payana-api
spring.datasource.url=jdbc:postgresql://localhost:5432/payana
spring.datasource.username=payana
spring.datasource.password=payana
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.hibernate.ddl-auto=none
# The current mobility APIs use remote/public feeds and in-memory services.
# Keep the database optional so the application can start without PostgreSQL.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
payana.realtime.bmtc.vehicle-url=https://maps.reclaim.city/bengaluru/rt/vehicle_positions.json
payana.realtime.bmtc.trip-url=https://maps.reclaim.city/bengaluru/rt/trip_updates.json
payana.realtime.bmtc.status-url=https://maps.reclaim.city/bengaluru/rt/status.json
payana.realtime.cache-ttl-seconds=30

